name: Codex Review (Azure OpenAI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: disable hosted tools that Azure doesn’t support
      - name: Disable web search tool
        run: |
          mkdir -p ~/.codex
          echo "[tools]" > ~/.codex/config.toml
          echo "web_search = false" >> ~/.codex/config.toml

      - name: Run Codex Review with Azure OpenAI
        uses: gersmann/codex-review-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1
          # Uncomment the next line if your Azure setup needs an explicit API version:
          # OPENAI_API_VERSION: "2025-03-01-preview"
        with:
          mode: review
          openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          model: gpt-4o-mini   # your Azure deployment name
          reasoning_effort: medium
          debug_level: 1
