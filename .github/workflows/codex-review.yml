name: Codex PR Review (Code Only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - run: npm i -g @openai/codex
        name: Install Codex CLI

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
      
          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      - name: Build code-only diff
        id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # List changed files
          CHANGED=$(git diff --name-only "$BASE...$HEAD")

          # Allow-list common code extensions; exclude workflows/config/docs/assets.
          CODE=$(echo "$CHANGED" | \
            grep -E '\.(c|cc|cpp|cxx|h|hpp|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|ex|exs|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|Makefile|gradle|groovy|zig)$' || true)

          CODE=$(echo "$CODE" | \
            grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|png|jpe?g|gif|svg|pdf)$' || true)

          printf "%s\n" $CODE > changed_code_files.txt || true

          if [ ! -s changed_code_files.txt ]; then
            : > code_only.diff
            echo "has_code=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git --no-pager diff --unified=0 "$BASE...$HEAD" -- $(tr '\n' ' ' < changed_code_files.txt) > code_only.diff || true
          if [ -s code_only.diff ]; then
            echo "has_code=true" >> $GITHUB_OUTPUT
          else
            echo "has_code=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip – no code changes
        if: ${{ steps.diff.outputs.has_code != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ":white_check_mark: No *code* changes to review (configs/docs/assets excluded)."
            });

      - name: Prepare brief review prompt
        if: ${{ steps.diff.outputs.has_code == 'true' }}
        run: |
          cat > review_task.txt << 'PROMPT'
          You are Codex in CI. Review ONLY the code changes in code_only.diff.
          Focus on: correctness, logic, edge cases, security, performance, and local style.
          Provide concise, actionable suggestions with small code blocks where helpful.
          Output a single Markdown file pr-review.md (must-fix first).
          PROMPT

      - name: Run Codex review (code-only)
        if: ${{ steps.diff.outputs.has_code == 'true' }}
        run: |
          codex exec "Read code_only.diff and follow review_task.txt. $(cat review_task.txt)"

      - name: Post review comment to PR
        if: ${{ steps.diff.outputs.has_code == 'true' && hashFiles('pr-review.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

