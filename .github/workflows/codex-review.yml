name: Codex PR Review (Azure OpenAI • Code Only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Write Codex config (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          model_reasoning_summary = "detailed"
          model_verbosity = "medium"
          approval_policy = "on-request"
          model_reasoning_effort = "high"

          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      - name: Build code-only diff
        id: codeonly
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # List changed files between base and head SHAs
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          # Allow-list common code extensions (no configs / content)
          # and HARD-EXCLUDE workflow/config & vendor/build paths.
          CODE_ONLY=$(echo "$CHANGED" | \
            grep -E '\.(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|zig|cmake|mk|make|gradle|groovy)$' || true)

          # Exclude non-code & infra/config:
          # - Workflows / GitHub config
          # - Generic configs & metadata
          # - Vendor/build artifacts
          CODE_ONLY=$(echo "$CODE_ONLY" | \
            grep -Ev '(^|/)\.github/|(^|/)azure-pipelines\.y[a]ml$|(^|/)Jenkinsfile$' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|yml)$' | \
            grep -Ev '(^|/)(dist|build|out|coverage|vendor|node_modules|\.git|\.husky|\.vscode|\.idea)($|/)' || true)

          # Also exclude any leftover workflow files explicitly
          CODE_ONLY=$(echo "$CODE_ONLY" | grep -Ev '(^|/)\.github/workflows/.*\.ya?ml$' || true)

          # Save the list for Codex
          printf "%s\n" $CODE_ONLY > changed_code_files.txt || true

          # If no code files remain, create an empty diff and flag 0
          if [ ! -s changed_code_files.txt ]; then
            : > code_only.diff
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create a tight unified=0 diff for ONLY those files
          git --no-pager diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- $(tr '\n' ' ' < changed_code_files.txt) > code_only.diff || true

          # If diff ended up empty (all deletions/renames filtered), mark 0
          if [ ! -s code_only.diff ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            echo "count=1" >> "$GITHUB_OUTPUT"
          fi

      - name: No code changes — post skip comment
        if: ${{ steps.codeonly.outputs.count == '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ":white_check_mark: Skipping Codex — no *code* changes to review (workflows/config/docs/assets were excluded)."
            });

      - name: Prepare code-only review task
        if: ${{ steps.codeonly.outputs.count == '1' }}
        run: |
          cat > review_task.txt << 'PROMPT'
          You are Codex running in CI on a GitHub Pull Request.

          Only review CODE changes from code_only.diff.
          Ignore workflows (.github/workflows/**), YAML/TOML/JSON configs, lockfiles, docs, media, generated and vendor/build outputs.

          Inputs:
            - changed_code_files.txt : newline list of code files that changed
            - code_only.diff         : unified=0 diff for those files

          Task:
            - Analyze code_only.diff (open files as needed) for correctness, logic, API contracts, edge cases, security, performance, and repo style.
            - Provide concrete suggestions with small code blocks / patch hunks where helpful.
            - Be concise and actionable; prioritize must-fix items first.

          Output:
            - Write a single Markdown review to pr-review.md for posting as a PR comment.
          PROMPT

      - name: Run Codex review (code-only)
        if: ${{ steps.codeonly.outputs.count == '1' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          codex exec "Read code_only.diff and changed_code_files.txt, then follow review_task.txt. $(cat review_task.txt)"

      - name: Post review comment to PR
        if: ${{ steps.codeonly.outputs.count == '1' && hashFiles('pr-review.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
