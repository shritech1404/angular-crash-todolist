name: Codex Review & Auto-README

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write          # needed to commit README updates on same-repo PRs
  pull-requests: write

jobs:
  review_and_readme:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # allow push with GITHUB_TOKEN

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Codex CLI
        run: npm i -g @openai/codex

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
          model_reasoning_summary = "detailed"
          model_reasoning_effort = "high"

          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      # Build repo inventory, deletions and diff (context). We’ll do repo-wide review + README generation.
      - name: Build repo inventory + deletions + diff
        id: inv
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git ls-files > all_files.txt

          CODE=$(cat all_files.txt | \
            grep -E '\.(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|Makefile|gradle|groovy|zig)$' || true)

          CODE=$(echo "$CODE" | \
            grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|png|jpe?g|gif|svg|pdf|map|min\.js)$' || true)

          printf "%s\n" $CODE > repo_code_files.txt || true

          git diff --name-status "$BASE...$HEAD" | awk '$1=="D"{print $2}' > deleted_files.txt || true

          CHANGED=$(git diff --name-only "$BASE...$HEAD" || true)
          CHANGED_CODE=$(echo "$CHANGED" | grep -F -f repo_code_files.txt || true)
          if [ -n "$CHANGED_CODE" ]; then
            git --no-pager diff --unified=0 "$BASE...$HEAD" -- $CHANGED_CODE > changed_code.diff || true
          else
            : > changed_code.diff
          fi

          if [ -s repo_code_files.txt ]; then
            echo "has_code=true" >> $GITHUB_OUTPUT
          else
            echo "has_code=false" >> $GITHUB_OUTPUT
          fi

      # =======================
      # PR REVIEW (repo-wide)
      # =======================
      - name: Prepare repo-wide review prompt
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        run: |
          cat > review_task.txt << 'PROMPT'
          You are Codex running in CI on a GitHub Pull Request.

          GOAL:
          Review the ENTIRE repository source code (not just the diff) and produce a single Markdown report to STDOUT.

          MUST INCLUDE (in this order):
          1) Summary
          2) Deleted Files & Potential Breakages
             - Use "deleted_files.txt". For each deleted file, identify plausible compile/runtime errors or API breakages it can cause.
             - Cite specific dependents (files/symbols) that likely break; show how to fix (restore, update imports, replace calls, etc.).
          3) Vulnerabilities
             - Injection, SSRF, XSS, CSRF, command injection, path traversal, unsafe deserialization, weak crypto, plaintext secrets, insecure HTTP.
             - For each, include file path + line(s), evidence, severity, and concrete fix steps.
          4) Performance
             - Hot paths, N+1 queries, O(n^2) over large inputs, blocking I/O in hot paths, unnecessary allocations/recomputation.
             - Include file path + line(s) and before/after snippets.
          5) Hardcoded Secrets
             - Scan for tokens/keys/passwords. List file path + line(s), obfuscate values, and recommend secret management.
             - Example patterns: AKIA|ghp_|xox[baprs]-|ssh\-rsa|BEGIN [A-Z ]+PRIVATE KEY|password\s*=|token\s*=
          6) Code Duplication
             - Significant duplicate/near-duplicate blocks: show file pairs/regions and a refactor plan.
          7) Changed Code (context)
             - Use "changed_code.diff" for context only, not as the scope.

          INPUTS:
          - repo_code_files.txt, deleted_files.txt, changed_code.diff
          - You may open and read any repo files.

          CONSTRAINTS:
          - Be specific and actionable, include file paths and line numbers when possible.
          - Prefer small patch hunks for fixes.
          - If uncertain, say "Likely" and explain briefly.

          OUTPUT:
          - Print a single Markdown report to STDOUT.
          PROMPT

      - name: Run Codex review (repo-wide, no files)
        id: codex_review
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="$(codex exec "Read repo_code_files.txt, deleted_files.txt, and changed_code.diff, then follow review_task.txt. $(cat review_task.txt)")" || true
          [ -z "$REVIEW" ] && REVIEW=":warning: Codex ran but produced no review output. Check CI logs."
          MAX=120000
          if [ ${#REVIEW} -gt $MAX ]; then
            REVIEW="${REVIEW:0:$MAX}\n\n… _(truncated)_"
          fi
          {
            echo 'body<<EOF'
            echo "$REVIEW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment to PR
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        uses: actions/github-script@v7
        env:
          REVIEW_BODY_JSON: ${{ toJson(steps.codex_review.outputs.body) }}
        with:
          script: |
            const body = JSON.parse(process.env.REVIEW_BODY_JSON || '""').trim() || ":warning: Codex output was empty.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      # =======================
      # README create / update
      # =======================
      - name: Prepare README prompt
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        run: |
          cat > readme_task.txt << 'PROMPT'
          You are Codex in CI. Generate or update README.md for this repository.

          CONTEXT:
          - You can read all repo files listed in repo_code_files.txt.
          - If README.md exists, improve it to reflect current code and PR changes (changed_code.diff).
          - If README.md does not exist, create a complete one.

          MUST INCLUDE SECTIONS (as applicable):
          - Project title & brief description
          - Quick start (install, build, run)
          - Configuration & environment variables
          - Architecture overview (key modules, data/model flows)
          - Commands/scripts (npm, make, gradle, etc.)
          - Testing & linting
          - Security notes (secret management best practices)
          - Performance tips (profiling flags, known hotspots if any)
          - Contribution guidelines
          - License
          - Changelog (brief recent changes if discernible)

          OUTPUT FORMAT:
          - Print ONLY the README content between these markers:
            <<<README_START>>>
            ...full markdown...
            <<<README_END>>>

          RULES:
          - Be accurate to the codebase; do not fabricate unsupported features.
          - If something is uncertain, note assumptions with "Assumption:".
          PROMPT

      - name: Generate README content with Codex
        id: gen_readme
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Tell Codex to read the inventory & diff; it can open files as needed.
          RAW="$(codex exec "Read repo_code_files.txt and changed_code.diff, then follow readme_task.txt. $(cat readme_task.txt)")" || true
          # Extract between markers to avoid JS parsing problems later.
          README_CONTENT="$(printf "%s" "$RAW" | awk '/<<<README_START>>>/{flag=1;next}/<<<README_END>>>/{flag=0}flag')"
          if [ -z "$README_CONTENT" ]; then
            README_CONTENT="<!-- README generation failed; see CI logs. -->"
          fi
          {
            echo 'readme<<EOF'
            echo "$README_CONTENT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write README and detect changes
        id: write_readme
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Write content to working tree
          printf "%s\n" "${{ steps.gen_readme.outputs.readme }}" > README.md
          # Check if anything changed compared to HEAD
          if git diff --quiet -- README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push README (same-repo PRs)
        if: ${{ steps.inv.outputs.has_code == 'true' && steps.write_readme.outputs.changed == 'true' && !github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(README): auto-update via Codex"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Suggest README patch (fork PRs or protected branches)
        if: ${{ steps.inv.outputs.has_code == 'true' && steps.write_readme.outputs.changed == 'true' && github.event.pull_request.head.repo.fork }}
        uses: actions/github-script@v7
        env:
          README_BODY_JSON: ${{ toJson(steps.gen_readme.outputs.readme) }}
        with:
          script: |
            const body = JSON.parse(process.env.README_BODY_JSON || '""');
            const patch = [
              "### README update suggestion",
              "",
              "This PR comes from a fork or a protected branch; auto-commit is disabled.",
              "",
              "**Proposed README.md content:**",
              "",
              "```markdown",
              body,
              "```"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: patch
            });

      - name: Skip — no code files in repo
        if: ${{ steps.inv.outputs.has_code != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ":white_check_mark: No code files found to review or document."
            });
