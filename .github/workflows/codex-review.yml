name: AI Agent Workflow
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  agent_task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Codex
        run: |
          echo "Setting up Codex environment..."
          # install deps, auth, etc.

      - name: Run Codex and produce review
        id: generate
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          TASK_DESCRIPTION: "Review code and check for any errors, vulnerabilities"
        run: |
          echo "Running Codex with task: ${TASK_DESCRIPTION}"

          # TODO: Replace the placeholder below with your real review command.
          # Example: python scripts/run_codex_review.py > review.md
          {
            echo "## 🤖 AI Code Review Summary"
            echo ""
            echo "- Scanned changed files"
            echo "- Found potential issues and suggestions"
            echo ""
            echo "### Findings"
            echo "1. example.py: consider input validation on line 42"
            echo "2. api/routes/user.ts: sanitize user-provided params"
            echo ""
            echo "### Security"
            echo "- No hard-coded secrets detected"
            echo "- Consider adding rate limits to /auth endpoints"
            echo ""
            echo "_Generated by Codex agent_"
          } > review.md

          # Expose the markdown as a job output (supports multiline)
          {
            echo "review<<'EOF'"
            cat review.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment review on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = core.getInput('body');
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Use a hidden marker so we can update the same comment each run
            const marker = '<!-- ai-code-review-comment -->';
            const newBody = `${marker}\n${body}`;

            // Find existing bot comment with our marker
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: newBody
              });
              core.info(`Updated existing AI review comment (#${existing.id}).`);
            } else {
              const { data: comment } = await github.rest.issues.createComment({
                owner, repo, issue_number, body: newBody
              });
              core.info(`Created new AI review comment (#${comment.id}).`);
            }
          result-encoding: string
          body: ${{ steps.generate.outputs.review }}
