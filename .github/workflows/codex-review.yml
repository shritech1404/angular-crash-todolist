name: Codex PR Review (Repo + PR diff, vulns & perf)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Codex CLI
        run: npm i -g @openai/codex

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
          model_reasoning_summary = "detailed"
          model_reasoning_effort = "high"

          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      # Build PR context with explicit detection of DELETIONS and references likely to break.
      - name: Build PR context (code-only + deletions)
        id: prctx
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # All changes w/ status (A,M,D,R,C,T)
          CHANGED_STATUS=$(git diff --name-status "$BASE...$HEAD" || true)
          echo "$CHANGED_STATUS" > changed_status.txt

          # Extract deleted files
          DELETED=$(echo "$CHANGED_STATUS" | awk '$1=="D"{print $2}')
          echo "$DELETED" > deleted_files.txt

          # Now derive "code-only" changed file list (including deletions) via allow-list.
          CHANGED=$(echo "$CHANGED_STATUS" | awk '{print $2}')
          CODE=$(echo "$CHANGED" | \
            grep -E '\.(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|make|Makefile|gradle|groovy|zig)$' || true)

          # Exclude workflows/config/docs/assets/vendor/build
          CODE=$(echo "$CODE" | \
            grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|png|jpe?g|gif|svg|pdf|map|min\.js)$' || true)

          printf "%s\n" $CODE > changed_code_files.txt || true

          # diff for code changes only (includes deleted file diffs via --diff-filter)
          if [ -s changed_code_files.txt ]; then
            git --no-pager diff --unified=0 --diff-filter=ACMRTD "$BASE...$HEAD" -- $(tr '\n' ' ' < changed_code_files.txt) > code_only.diff || true
          else
            : > code_only.diff
          fi

          # Build a rough "impacted refs" search for deleted files (search in HEAD tree)
          : > impacted_refs.txt
          if [ -s deleted_files.txt ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              name="$(basename "$f")"
              stem="${name%.*}"
              # Search common reference patterns by stem; ignore binary
              echo "### References possibly impacted by deletion of: $f" >> impacted_refs.txt
              git grep -n -I -E "(^|[^A-Za-z0-9_])${stem}([^A-Za-z0-9_]|$)" || true >> impacted_refs.txt
              echo "" >> impacted_refs.txt
            done < deleted_files.txt
          fi

          # Expose “has_code_changes” and “has_deletions” as step outputs
          if [ -s code_only.diff ]; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          fi
          if [ -s deleted_files.txt ] && [ -n "$(grep -v '^[[:space:]]*$' deleted_files.txt)" ]; then
            echo "has_deletions=true" >> $GITHUB_OUTPUT
          else
            echo "has_deletions=false" >> $GITHUB_OUTPUT
          fi

      # =============================
      # 1) PR-DIFF REVIEW (mentions deleted files + breakages)
      # =============================
      - name: Codex – PR review (diff + deletions)
        id: pr_review
        if: ${{ steps.prctx.outputs.has_code_changes == 'true' || steps.prctx.outputs.has_deletions == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="$(codex exec "You are Codex in CI for a Pull Request.

          Inputs in workspace:
          - changed_status.txt : 'git diff --name-status' between base..head
          - changed_code_files.txt : code files that changed
          - code_only.diff : unified=0 diff for those code files
          - deleted_files.txt : list of deleted files (if any)
          - impacted_refs.txt : grep hits in HEAD that may reference deleted files

          Task:
          - Produce a concise PR review that MUST:
            * Summarize code changes from code_only.diff (no restating hunks).
            * Explicitly list deleted code files (deleted_files.txt) and analyze likely impact.
            * Use impacted_refs.txt to call out code that may now fail (imports/usage).
            * Provide actionable fixes with small code blocks or patch suggestions.
            * Prioritize must-fix items first; then nice-to-haves.
          - Keep the output suitable as a PR comment in Markdown.")" || true

          [ -z "$REVIEW" ] && REVIEW=":warning: Codex PR-diff review produced no output."

          {
            echo 'body<<EOF'
            echo "$REVIEW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # =============================
      # 2) FULL-REPO REVIEW (like "codex review" of the codebase)
      #    Includes vulnerability & performance passes
      # =============================
      - name: Codex – full repo review (security + performance)
        id: repo_review
        shell: bash
        run: |
          set -euo pipefail

          # Build a repo code inventory (lightweight list)
          git ls-files > repo_files_all.txt
          grep -E '\.(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|make|Makefile|gradle|groovy|zig)$' repo_files_all.txt \
            | grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' \
            > repo_code_files.txt || true

          REVIEW="$(codex exec "You are Codex performing a whole-repository code review (similar to 'codex review').

          Inputs in workspace:
          - repo_code_files.txt : list of code files in the repo to consider

          Tasks (produce one Markdown report):
          1) GENERAL CODE HEALTH:
             - Identify architectural risks, dead code, missing tests, unclear boundaries.
          2) VULNERABILITIES:
             - Look for insecure patterns (injection, unsafe eval/exec, command/FS access, weak crypto, SSRF, hard-coded secrets).
             - Call out risky dependencies *by usage* (e.g., unsafe libs/patterns) even if lockfiles are excluded.
             - Suggest concrete mitigations or safer APIs.
          3) PERFORMANCE:
             - Flag hot paths with obvious inefficiencies (O(n^2), N+1 queries, unnecessary sync I/O, large JSON/string copies, blocking operations on hot paths).
             - Recommend optimizations or algorithmic improvements with code samples.
          4) PRIORITIZED ACTIONS:
             - Provide a checklist of MUST-FIX vs NICE-TO-HAVE items with file/line anchors where possible.

          You may open files from repo_code_files.txt to inspect details. Keep the output compact and actionable.")" || true

          [ -z "$REVIEW" ] && REVIEW=":warning: Codex full-repo review produced no output."

          {
            echo 'body<<EOF'
            echo "$REVIEW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Combine both reviews and post a single PR comment (no temp files committed)
      - name: Post review comment to PR
        uses: actions/github-script@v7
        env:
          PR_REVIEW_JSON:   ${{ toJson(steps.pr_review.outputs.body) }}
          REPO_REVIEW_JSON: ${{ toJson(steps.repo_review.outputs.body) }}
        with:
          script: |
            const prReview   = JSON.parse(process.env.PR_REVIEW_JSON   || '""');
            const repoReview = JSON.parse(process.env.REPO_REVIEW_JSON || '""');

            const parts = [];
            if (prReview) {
              parts.push("## PR Review (Diff & Deletions)\n\n" + prReview.trim());
            }
            if (repoReview) {
              parts.push("\n---\n\n## Full Repo Review (Vulnerabilities & Performance)\n\n" + repoReview.trim());
            }
            const body = (parts.join("\n\n") || ":warning: No review output generated.").trim();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      # Optional: if absolutely nothing to say, post a friendly note
      - name: Fallback – nothing to review
        if: ${{ steps.prctx.outputs.has_code_changes != 'true' && steps.prctx.outputs.has_deletions != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ":white_check_mark: No code changes detected and no deletions; posted full repo review above."
            });
