name: Codex PR Review (Repo-wide + Deleted Files + Sec/Perf/Secrets/Dup + README Update + Extras)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm i -g @openai/codex

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
          model_reasoning_summary = "detailed"
          model_reasoning_effort = "high"

          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      # Build a repo-wide inventory, note deletions, and also keep a focused diff for context.
      - name: Build repo inventory + deletions + diff
        id: inv
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # All tracked files in repo
          git ls-files > all_files.txt

          # Allow-list common code extensions; exclude docs/assets/vendor/build/etc.
          CODE=$(cat all_files.txt | \
            grep -E '\.(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|Makefile|gradle|groovy|zig)$' || true)

          CODE=$(echo "$CODE" | \
            grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|png|jpe?g|gif|svg|pdf|map|min\.js)$' || true)

          printf "%s\n" $CODE > repo_code_files.txt || true

          # Deleted files between base and head (important for breakage analysis)
          git diff --name-status "$BASE...$HEAD" | awk '$1=="D"{print $2}' > deleted_files.txt || true

          # Focused diff for changed code (context helps), but review will be repo-wide
          CHANGED=$(git diff --name-only "$BASE...$HEAD" || true)
          CHANGED_CODE=$(echo "$CHANGED" | grep -F -f repo_code_files.txt || true)
          if [ -n "$CHANGED_CODE" ]; then
            git --no-pager diff --unified=0 "$BASE...$HEAD" -- $CHANGED_CODE > changed_code.diff || true
          else
            : > changed_code.diff
          fi

          # Flags for downstream steps
          if [ -s repo_code_files.txt ]; then
            echo "has_code=true" >> $GITHUB_OUTPUT
          else
            echo "has_code=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare repo-wide review prompt
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        run: |
          cat > review_task.txt << 'PROMPT'
          You are Codex running in CI on a GitHub Pull Request.

          GOAL:
          Review the ENTIRE repository source code (not just the diff) and produce a single Markdown report to STDOUT.

          MUST INCLUDE (in this order):
          1) Summary
             - One-paragraph overview of key risks and themes.
          2) Deleted Files & Potential Breakages
             - Use "deleted_files.txt". For each deleted file, identify plausible compile/runtime errors or API breakages it can cause.
             - Cite specific dependents (files/symbols) that likely break; show how to fix (restore, update imports, replace calls, etc.).
          3) Vulnerabilities
             - Look for common security issues (injection, unsafe deserialization, path traversal, SSRF, XSS, CSRF, command injection, weak crypto, insecure HTTP).
             - Call out risky dependencies or unpinned versions if visible.
             - For each finding, include file path + line(s), evidence, severity, and concrete fix steps.
          4) Performance
             - Identify hot paths, N+1 queries, excessive allocations, unnecessary recomputation, O(n^2) loops on large inputs, blocking I/O on hot paths.
             - Include file path + line(s) and show before/after code snippets or micro-optimizations.
          5) Hardcoded Secrets
             - Scan for access keys, tokens, passwords, private keys, connection strings.
             - For each suspected secret, list file path + line(s), obfuscate values (do NOT print full secrets), and recommend secret management approach.
             - Example patterns: AWS_(ACCESS|SECRET)|AKIA|xox[baprs]-|ghp_|ssh\-rsa|BEGIN [A-Z ]+PRIVATE KEY|password\s*=|token\s*=
          6) Code Duplication (detailed)
             - Identify significant duplicate or near-duplicate functions/blocks across files.
             - For each duplication, provide:
               - File pairs (paths) and the approximate number of duplicated lines for each region.
               - The starting line(s) in both files (best-effort).
               - A suggested refactor (shared util, template, or abstraction) and show a brief before/after patch.
          7) Changed Code (Context)
             - Use "changed_code.diff" only for additional context; do not limit the review to these changes.
          8) Debug/Print Logs Audit
             - Check for leftover debug or noisy logging statements (e.g., print, console.log, Logger.debug/trace, fmt.Println, System.out.println, puts, etc.).
             - List file path + line(s) with a short rationale and suggest actions (remove, downgrade level, guard behind env flag).
          9) Dependencies vs requirements.txt (if present)
             - Validate that Python dependencies are sensibly pinned (avoid floating versions), and that imports used in code are represented in requirements.
             - Flag mismatches (declared but unused; used but missing), potential outdated/unsafe versions, and unpinned or overly broad specifiers.
             - Provide concrete update suggestions (specific pins or removals).
          10) Configuration & Environment Variables
             - Evaluate how env/config are accessed (e.g., os.getenv/process.env/config files).
             - Check for: missing validation/defaults, secrets in repo, unsafe defaults in production, and clear documentation (.env.example or README).
             - For each issue, include file path + line(s) and propose a fix pattern (validation wrapper, schema, defaults, fallback order).
          
          INPUTS AVAILABLE IN WORKSPACE:
          - repo_code_files.txt : newline list of all code files in the repo
          - deleted_files.txt   : newline list of files deleted in this PR
          - changed_code.diff   : unified=0 diff for changed code files (context only)
          - You may open and read any repo files (e.g., requirements.txt, Pipfile, pyproject.toml, package.json, etc.).

          CONSTRAINTS:
          - Be specific and actionable. Always include the file path(s) and line numbers when you can.
          - Prefer small patch-style code blocks for fixes.
          - If something is uncertain, say "Likely" and explain the reasoning.
          - Keep the report tight and useful for reviewers; no boilerplate.

          OUTPUT:
          - Print the final Markdown report to STDOUT only (no files).
          PROMPT

      - name: Run Codex review (repo-wide, no file)
        id: codex_review
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="$(codex exec "Read repo_code_files.txt, deleted_files.txt, and changed_code.diff, then follow review_task.txt. $(cat review_task.txt)")" || true
          if [ -z "$REVIEW" ]; then
            REVIEW=":warning: Codex ran but produced no review output. Check CI logs."
          fi
          # Optional truncation to avoid comment size limits (adjust if needed)
          MAX=120000
          if [ ${#REVIEW} -gt $MAX ]; then
            REVIEW="${REVIEW:0:$MAX}\n\n… _(truncated)_"
          fi
          {
            echo 'body<<EOF'
            echo "$REVIEW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment to PR
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        uses: actions/github-script@v7
        env:
          REVIEW_BODY_JSON: ${{ toJson(steps.codex_review.outputs.body) }}
        with:
          script: |
            const body = JSON.parse(process.env.REVIEW_BODY_JSON || '""').trim() || ":warning: Codex output was empty.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      # Automatically update README with a short summary of the latest Codex review.
      - name: Update README with Codex review summary
        if: ${{ steps.inv.outputs.has_code == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          REVIEW_MD: ${{ steps.codex_review.outputs.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Ensure a README exists
          if [ ! -f README.md ]; then
            echo "# ${GITHUB_REPOSITORY##*/}" > README.md
            echo "" >> README.md
          fi

          # Extract a concise "Summary" block from the Codex review (up to first next numbered section or 25 lines)
          echo "$REVIEW_MD" > .codex_review_full.md

          awk '
            BEGIN{capture=0; lines=0}
            /^1\)\s*Summary/ {capture=1; next}
            capture && /^[0-9]+\)\s/ {capture=0}
            capture && lines<25 {print; lines++}
          ' .codex_review_full.md > .codex_review_summary.md || true

          # If the Summary section wasn’t detected, fall back to first 15 lines
          if [ ! -s .codex_review_summary.md ]; then
            head -n 15 .codex_review_full.md > .codex_review_summary.md || true
          fi

          # Compose the snippet we’ll place into README between markers
          {
            echo "<!-- codex-review:start -->"
            echo "<details>"
            echo "<summary>Latest Codex Review (PR #${PR_NUMBER}) — generated by @${ACTOR}</summary>"
            echo ""
            echo "_Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")_  •  _Commit:_ \`${COMMIT_SHA:0:12}\`  •  [View PR](${PR_URL})  •  [Action Run](${RUN_URL})"
            echo ""
            echo "#### Summary"
            echo ""
            cat .codex_review_summary.md
            echo ""
            echo "</details>"
            echo "<!-- codex-review:end -->"
          } > .codex_review_block.md

          # Insert or replace the block in README.md
          if grep -q '<!-- codex-review:start -->' README.md; then
            # Replace existing block
            perl -0777 -pe 'BEGIN{undef $/} s/<!-- codex-review:start -->.*?<!-- codex-review:end -->/'"$(sed -e 's/[\/&]/\\&/g' .codex_review_block.md | tr -d '\n' )"'/s' README.md > README.md.new
            mv README.md.new README.md
          else
            # Append a new section near the end
            {
              echo ""
              echo "## Automated Code Review"
              cat .codex_review_block.md
            } >> README.md
          fi

          # Commit only if there are changes
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(readme): update Codex review summary for PR #${PR_NUMBER} [skip ci]"
            # Push to the PR branch
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          else
            echo "No README changes to commit."
          fi

      - name: Skip – no code files in repo
        if: ${{ steps.inv.outputs.has_code != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ":white_check_mark: No code files found to review (non-code repo or everything excluded)."
            });
