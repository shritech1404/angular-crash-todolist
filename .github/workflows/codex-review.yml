name: Codex Autonomous Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Codex autonomous review
        uses: gersmann/codex-review-action@v1
        with:
          mode: review
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5
          reasoning_effort: medium
          debug_level: 1
          # Ensure no web search / browsing tool is requested
          tools: []  

  perf:
    name: Performance Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node (if Node project)
        if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Node perf: install & run tests / benchmarks
        if: hashFiles('**/package.json') != ''
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          /usr/bin/time -f "Elapsed %E | CPU %P | Mem %M KB" npm run test || echo "No npm test"
          npm run bench || echo "No npm bench"
      - name: Setup Python (if Python project)
        if: hashFiles('**/requirements.txt') != '' || hashFiles('**/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Python perf: run tests with durations
        if: hashFiles('**/requirements.txt') != '' || hashFiles('**/pyproject.toml') != ''
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f pyproject.toml ]; then pip install . || true; fi
          pip install pytest || true
          /usr/bin/time -f "Elapsed %E | CPU %P | Mem %M KB" pytest -q --maxfail=1 --durations=20 || echo "No pytest tests"
      - name: Setup Go (if Go project)
        if: hashFiles('**/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Go perf: tests & benches
        if: hashFiles('**/go.mod') != ''
        run: |
          set -e
          /usr/bin/time -f "Elapsed %E | CPU %P | Mem %M KB" go test ./... -run . -count=1 || true
          go test ./... -bench=. -run=^$ || echo "No Go benchmarks"

  vuln-scan:
    name: Vulnerabilities Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp,cpp,go,java,javascript,python

      - name: Autobuild (best effort)
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        permissions:
          security-events: write

      - name: Node audit (npm)
        if: hashFiles('**/package.json') != ''
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high || true

      - name: Python audit (pip-audit)
        if: hashFiles('**/requirements.txt') != '' || hashFiles('**/pyproject.toml') != ''
        run: |
          set -e
          python3 -m pip install --upgrade pip pip-audit || true
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt || true; fi
          if [ -f pyproject.toml ]; then pip-audit || true; fi

      - name: Go audit (govulncheck)
        if: hashFiles('**/go.mod') != ''
        run: |
          set -e
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ~/go/bin/govulncheck ./... || true

  docs:
    name: Update Docs / README
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [review]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate PR documentation
        id: prdoc
        run: |
          set -e
          mkdir -p docs
          FILE="docs/PR-${{ github.event.pull_request.number }}.md"
          echo "# PR #${{ github.event.pull_request.number }} – ${{ github.event.pull_request.title }}" > "$FILE"
          echo "" >> "$FILE"
          echo "Author: @${{ github.event.pull_request.user.login }}" >> "$FILE"
          echo "Branch: ${{ github.event.pull_request.head.ref }}" >> "$FILE"
          echo "Created: ${{ github.event.pull_request.created_at }}" >> "$FILE"
          echo "" >> "$FILE"
          echo "## Summary" >> "$FILE"
          echo "${{ github.event.pull_request.body }}" >> "$FILE"
          echo "" >> "$FILE"
          echo "## Changed files" >> "$FILE"
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff --name-status origin/${{ github.event.pull_request.base.ref }}...HEAD >> "$FILE" || true
          echo "::set-output name=file::$FILE"
      - name: Update README “Recent Changes”
        run: |
          set -e
          touch README.md
          if ! grep -q "## Recent Changes" README.md; then
            printf "\n## Recent Changes\n\n" >> README.md
          fi
          echo "- See [PR #${{ github.event.pull_request.number }} summary](docs/PR-${{ github.event.pull_request.number }}.md)" >> README.md
      - name: Commit & push docs (only for non-fork PRs)
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PR-${{ github.event.pull_request.number }}.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update README + PR summary (#${{ github.event.pull_request.number }})"
            git push
          fi
      - name: Upload docs artifact (for forks)
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-docs-${{ github.event.pull_request.number }}
          path: |
            README.md
            docs/PR-${{ github.event.pull_request.number }}.md

  act:
    name: Act on /codex comments
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/codex')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/codex'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Codex autonomous edits
        uses: gersmann/codex-review-action@v1
        with:
          mode: act
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5
          debug_level: 1
          tools: []
