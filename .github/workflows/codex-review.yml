name: Codex PR Review (Repo-wide + Deleted Files + Sec/Perf/Secrets/Dup)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write         # ⬅️ allow README updates/commits
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm i -g @openai/codex

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
          model_reasoning_summary = "detailed"
          model_reasoning_effort = "high"

          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      # Build a repo-wide inventory, note deletions, and also keep a focused diff for context.
      - name: Build repo inventory + deletions + diff
        id: inv
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git ls-files > all_files.txt

          CODE=$(cat all_files.txt | \
            grep -E '\.(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|Makefile|gradle|groovy|zig)$' || true)

          CODE=$(echo "$CODE" | \
            grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|png|jpe?g|gif|svg|pdf|map|min\.js)$' || true)

          printf "%s\n" $CODE > repo_code_files.txt || true

          git diff --name-status "$BASE...$HEAD" | awk '$1=="D"{print $2}' > deleted_files.txt || true

          CHANGED=$(git diff --name-only "$BASE...$HEAD" || true)
          CHANGED_CODE=$(echo "$CHANGED" | grep -F -f repo_code_files.txt || true)
          if [ -n "$CHANGED_CODE" ]; then
            git --no-pager diff --unified=0 "$BASE...$HEAD" -- $CHANGED_CODE > changed_code.diff || true
          else
            : > changed_code.diff
          fi

          if [ -s repo_code_files.txt ]; then
            echo "has_code=true" >> $GITHUB_OUTPUT
          else
            echo "has_code=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare repo-wide review prompt
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        run: |
          cat > review_task.txt << 'PROMPT'
          You are Codex running in CI on a GitHub Pull Request.

          GOAL:
          Review the ENTIRE repository source code (not just the diff) and produce a single Markdown report to STDOUT.

          MUST INCLUDE (in this order):
          1) Summary
             - One-paragraph overview of key risks and themes.
          2) Deleted Files & Potential Breakages
             - Use "deleted_files.txt". For each deleted file, identify plausible compile/runtime errors or API breakages it can cause.
             - Cite specific dependents (files/symbols) that likely break; show how to fix (restore, update imports, replace calls, etc.).
          3) Vulnerabilities
             - Look for common security issues (injection, unsafe deserialization, path traversal, SSRF, XSS, CSRF, command injection, weak crypto, insecure HTTP).
             - Call out risky dependencies or unpinned versions if visible.
             - For each finding, include file path + line(s), evidence, severity, and concrete fix steps.
          4) Performance
             - Identify hot paths, N+1 queries, excessive allocations, unnecessary recomputation, O(n^2) loops on large inputs, blocking I/O on hot paths.
             - Include file path + line(s) and show before/after code snippets or micro-optimizations.
          5) Hardcoded Secrets
             - Scan for access keys, tokens, passwords, private keys, connection strings.
             - For each suspected secret, list file path + line(s), obfuscate values (do NOT print full secrets), and recommend secret management approach.
             - Example patterns: AWS_(ACCESS|SECRET)|AKIA|xox[baprs]-|ghp_|ssh\-rsa|BEGIN [A-Z ]+PRIVATE KEY|password\s*=|token\s*=
          6) Code Duplication
             - Identify significant duplicate or near-duplicate functions/blocks across files (same/very similar logic).
             - Provide file pairs/regions, a brief rationale, and a suggested refactor (shared util, template, or abstraction).
          7) Changed Code (Context)
             - Use "changed_code.diff" only for additional context; do not limit the review to these changes.

          INPUTS AVAILABLE IN WORKSPACE:
          - repo_code_files.txt : newline list of all code files in the repo
          - deleted_files.txt   : newline list of files deleted in this PR
          - changed_code.diff   : unified=0 diff for changed code files (context only)
          - You may open and read any repo files.

          CONSTRAINTS:
          - Be specific and actionable. Always include the file path(s) and line numbers when you can.
          - Prefer small patch-style code blocks for fixes.
          - If something is uncertain, say "Likely" and explain the reasoning.
          - Keep the report tight and useful for reviewers; no boilerplate.

          OUTPUT:
          - Print the final Markdown report to STDOUT only (no files).
          PROMPT

      - name: Run Codex review (repo-wide, no file)
        id: codex_review
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="$(codex exec "Read repo_code_files.txt, deleted_files.txt, and changed_code.diff, then follow review_task.txt. $(cat review_task.txt)")" || true
          if [ -z "$REVIEW" ]; then
            REVIEW=":warning: Codex ran but produced no review output. Check CI logs."
          fi
          MAX=120000
          if [ ${#REVIEW} -gt $MAX ]; then
            REVIEW="${REVIEW:0:$MAX}\n\n… _(truncated)_"
          fi
          {
            echo 'body<<EOF'
            echo "$REVIEW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Additional requested checks
      # -----------------------------

      - name: Install analyzers (jscpd, jq, python)
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm i -g jscpd@3.x
          python -m pip install --upgrade pip
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Code duplication report (file names + line ranges)
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        id: dup
        shell: bash
        run: |
          set -euo pipefail
          # Limit to code files we enumerated
          jscpd --silent --reporters json --output reports --pattern "**/*" --exclude "**/node_modules/**,**/dist/**,**/build/**,**/out/**" --min-lines 10 --min-tokens 50 || true
          if [ -f reports/jscpd-report.json ]; then
            DUPS=$(jq '.duplicates | length' reports/jscpd-report.json)
          else
            DUPS=0
          fi

          echo "count=$DUPS" >> $GITHUB_OUTPUT

          # Make a concise Markdown summary with files and line ranges
          {
            echo "### Code Duplication"
            if [ "$DUPS" -gt 0 ]; then
              echo ""
              echo "| # | File A (lines) | File B (lines) | Lines | Tokens |"
              echo "|---|-----------------|-----------------|-------|--------|"
              jq -r '
                .duplicates[]
                | .firstFile as $a
                | .secondFile as $b
                | [($a.name + " (" + ($a.start|tostring) + "-" + ($a.end|tostring) + ")"),
                   ($b.name + " (" + ($b.start|tostring) + "-" + ($b.end|tostring) + ")"),
                   (.lines|tostring),
                   (.tokens|tostring)]
                | @tsv
              ' reports/jscpd-report.json \
              | nl -w1 -s$'\t' \
              | awk -F'\t' '{printf("| %s | %s | %s | %s | %s |\n",$1,$2,$3,$4,$5)}'
              echo ""
              echo "_Consider extracting shared utilities or templates._"
            else
              echo ""
              echo "_No significant duplication detected (by jscpd thresholds)._"
            fi
          } > ci_duplication.md

      - name: Scan for debug logs / print statements
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        id: debugscan
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='(console\.log|print\(|logger\.debug|debugger;|pdb\.set_trace|System\.out\.println|fmt\.Print(f|ln)?\(|printf\(|qDebug\()'
          # exclude tests and tooling
          MATCHES=$(grep -RInE "$PATTERN" -- $(cat repo_code_files.txt) 2>/dev/null | grep -Ev '(test|spec|\.snap|scripts/|tools/)' || true)
          {
            echo "### Debug/Verbose Logs"
            if [ -n "$MATCHES" ]; then
              echo ""
              echo "| File | Line | Snippet |"
              echo "|------|------|---------|"
              echo "$MATCHES" | sed 's/:/ /' | awk '{file=$1; line=$2; $1=""; $2=""; sub(/^ /,""); snippet=$0; gsub(/\|/,"\\|",snippet); printf("| %s | %s | `%s` |\n",file,line,substr(snippet,1,120))}'
              echo ""
              echo "_Remove or guard with environment-based log levels before merging._"
            else
              echo ""
              echo "_No stray debug prints found in non-test code._"
            fi
          } > ci_debug_logs.md

      - name: Python dependency checks (requirements.txt)
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        id: pydeps
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PY_CHANGED=$(git diff --name-only "$BASE...$HEAD" | grep -E '\.py$' || true)
          REQ_CHANGED=$(git diff --name-only "$BASE...$HEAD" | grep -E '^requirements\.txt$' || true)
          HAS_REQ=""
          if [ -f requirements.txt ]; then HAS_REQ="yes"; fi

          WARN_IMPORTS=""
          if [ -n "$PY_CHANGED" ] && [ -z "$REQ_CHANGED" ] && [ -n "$HAS_REQ" ]; then
            WARN_IMPORTS=":warning: Python files changed but requirements.txt not updated."
          fi

          PIP_REPORT=""
          if [ -n "$HAS_REQ" ]; then
            python -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip >/dev/null
            if pip install -r requirements.txt >/tmp/pip_install.log 2>&1; then
              if ! pip check >/tmp/pip_check.log 2>&1; then
                PIP_REPORT=":warning: \`pip check\` reported issues:\n\n\`\`\`\n$(cat /tmp/pip_check.log)\n\`\`\`"
              else
                PIP_REPORT=":white_check_mark: Dependencies install and resolve cleanly."
              fi
            else
              PIP_REPORT=":warning: Failed to install requirements. See logs in CI artifacts."
            fi
            deactivate
          else
            PIP_REPORT="_No requirements.txt found; skipping pip checks._"
          fi

          {
            echo "### Python Dependencies"
            echo ""
            [ -n "$WARN_IMPORTS" ] && echo "$WARN_IMPORTS" && echo ""
            echo -e "$PIP_REPORT"
          } > ci_dependencies.md

      - name: Config & Environment variables handling check
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        id: envcheck
        shell: bash
        run: |
          set -euo pipefail
          # Simple heuristics: env lookups without defaults and insecure patterns
          PY_ENV=$(grep -RInE 'os\.environ\[[^\]]+\]' -- *.py 2>/dev/null || true)
          PY_GETENV_NODEFAULT=$(grep -RInE 'os\.getenv\(\s*["'\''"][A-Z0-9_]+["'\'']\s*\)' -- *.py 2>/dev/null || true)
          NODE_ENV=$(grep -RInE 'process\.env\.[A-Z0-9_]+' -- $(cat repo_code_files.txt | grep -E '\.([jt]sx?|vue|svelte)$' || true) 2>/dev/null || true)

          {
            echo "### Config & Environment Handling"
            echo ""
            if [ -n "$PY_ENV" ] || [ -n "$PY_GETENV_NODEFAULT" ] || [ -n "$NODE_ENV" ]; then
              [ -n "$PY_ENV" ] && echo "**Direct \`os.environ[...]\` (no default, may throw KeyError):**" && echo "" && echo '```' && echo "$PY_ENV" && echo '```' && echo ""
              [ -n "$PY_GETENV_NODEFAULT" ] && echo "**\`os.getenv(NAME)\` without default:**" && echo "" && echo '```' && echo "$PY_GETENV_NODEFAULT" && echo '```' && echo ""
              [ -n "$NODE_ENV" ] && echo "**Node env var usages (ensure defaults/validation):**" && echo "" && echo '```' && echo "$NODE_ENV" && echo '```' && echo ""
              echo "_Consider centralized config, type-checked schemas, and defaults (12-factor)._" 
            else
              echo "_No obvious risky env var usage detected by heuristics._"
            fi
          } > ci_env.md

      - name: Assemble CI findings for README
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          echo "## 🔎 CI Findings for this PR" > CI_FINDINGS_SECTION.md
          echo "" >> CI_FINDINGS_SECTION.md
          echo "_Auto-generated. Do not edit between markers; CI will overwrite._" >> CI_FINDINGS_SECTION.md
          echo "" >> CI_FINDINGS_SECTION.md
          cat ci_duplication.md >> CI_FINDINGS_SECTION.md
          echo "" >> CI_FINDINGS_SECTION.md
          cat ci_debug_logs.md >> CI_FINDINGS_SECTION.md
          echo "" >> CI_FINDINGS_SECTION.md
          cat ci_dependencies.md >> CI_FINDINGS_SECTION.md
          echo "" >> CI_FINDINGS_SECTION.md
          cat ci_env.md >> CI_FINDINGS_SECTION.md

      - name: Update README.md with CI findings (auto)
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          START="<!-- CI_FINDINGS:START -->"
          END="<!-- CI_FINDINGS:END -->"
          NEW_CONTENT="$(cat CI_FINDINGS_SECTION.md)"

          if [ -f README.md ]; then
            if grep -q "$START" README.md && grep -q "$END" README.md; then
              # Replace existing block
              awk -v start="$START" -v end="$END" -v new="$NEW_CONTENT" '
                BEGIN{print_block=1}
                {
                  if ($0 ~ start) {print $0; print new; skip=1; next}
                  if ($0 ~ end) {print $0; skip=0; next}
                  if (!skip) print $0
                }' README.md > README.md.tmp
              mv README.md.tmp README.md
            else
              # Append new block at end
              {
                echo ""
                echo "$START"
                echo "$NEW_CONTENT"
                echo "$END"
              } >> README.md
            fi
          else
            {
              echo "# Project"
              echo ""
              echo "$START"
              echo "$NEW_CONTENT"
              echo "$END"
            } > README.md
          fi

      - name: Commit README update
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-update README with CI findings"
          branch: ${{ github.head_ref }}
          file_pattern: README.md

      - name: Post review comment to PR
        if: ${{ steps.inv.outputs.has_code == 'true' }}
        uses: actions/github-script@v7
        env:
          REVIEW_BODY_JSON: ${{ toJson(steps.codex_review.outputs.body) }}
        with:
          script: |
            const body = JSON.parse(process.env.REVIEW_BODY_JSON || '""').trim() || ":warning: Codex output was empty.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Skip – no code files in repo
        if: ${{ steps.inv.outputs.has_code != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: ":white_check_mark: No code files found to review (non-code repo or everything excluded)."
            });
