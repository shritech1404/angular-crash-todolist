name: Codex Autonomous Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Codex autonomous review (Azure OpenAI)
        uses: gersmann/codex-review-action@v1
        env:
          # Point OpenAI SDK at Azure
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1
        with:
          mode: review
          # The action still expects an "openai_api_key" input; pass the Azure key
          openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          # Use your Azure **deployment name** (not the base model name)
          model: ${{ secrets.AZURE_OPENAI_MODEL }}
          reasoning_effort: medium
          debug_level: 1

  act:
    name: Act on /codex comments
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/codex')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '/codex'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Codex autonomous edits (Azure OpenAI)
        uses: gersmann/codex-review-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1
        with:
          mode: act
          openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          model: ${{ secrets.AZURE_OPENAI_MODEL }}
          debug_level: 1
