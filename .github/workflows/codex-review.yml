name: Azure-OpenAI Codex PR Review

on:
  pull_request:
    types: [opened, synchronized, reopened]

permissions:
  contents: write        # needed if you plan to commit changes (e.g. updating docs)
  pull-requests: write    # to post comments or update PR
  issues: write            # for comments (issues API works for PRs too)

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment variables
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # You might not need a run here — just env setup for later steps

      - name: Run Azure OpenAI review
        id: codex_review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              mediaType: { format: 'diff' }
            });
            const diffText = diff.data;

            // Call Azure OpenAI via fetch (or use a wrapper) to get a review
            // Example minimal call — adapt or use your own wrapper / client
            const endpoint = process.env.AZURE_OPENAI_ENDPOINT;
            const apiKey = process.env.AZURE_OPENAI_KEY;
            const deployment = process.env.AZURE_OPENAI_DEPLOYMENT;

            const prompt = `
You are a code reviewer. The following diff (PR #${pr.number}) should be evaluated. Please provide:
1. Correctness / bug risks
2. Performance optimization suggestions
3. Security / vulnerability issues
4. Documentation / README suggestions
5. Code style / maintainability pointers

Diff:
\`\`\`
${diffText}
\`\`\`
`;

            const response = await fetch(`${endpoint}/openai/deployments/${deployment}/chat/completions?api-version=2023-05-15`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'api-key': apiKey
              },
              body: JSON.stringify({
                messages: [
                  { role: 'system', content: 'You are a helpful code reviewer.' },
                  { role: 'user', content: prompt }
                ],
                max_tokens: 1000,
                temperature: 0.0
              })
            });

            if (!response.ok) {
              throw new Error(`OpenAI response error: ${response.status}`);
            }

            const respJson = await response.json();
            const reviewText = respJson.choices[0].message.content;

            // Post comment on PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `**Codex Review (Azure OpenAI)**\n\n${reviewText}`
            });

      # (Optional) If you want to let the AI propose doc updates (README etc.) and commit them
      update-docs:
        runs-on: ubuntu-latest
        needs: review
        steps:
          - name: Checkout code
            uses: actions.checkout@v5
            with:
              fetch-depth: 0

          - name: Generate doc changes via Azure OpenAI
            id: gen_docs
            uses: actions/github-script@v7
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
              script: |
                const pr = context.payload.pull_request;
                const diff = (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  mediaType: { format: 'diff' }
                })).data;

                const prompt = `
Based on the changes in this PR, generate edits to README, doc files or comments to reflect the new behavior. Provide output as a unified diff patch or file modifications.
Diff:
\`\`\`
${diff}
\`\`\`
`;

                const endpoint = process.env.AZURE_OPENAI_ENDPOINT;
                const apiKey = process.env.AZURE_OPENAI_KEY;
                const deployment = process.env.AZURE_OPENAI_DEPLOYMENT;

                const response = await fetch(`${endpoint}/openai/deployments/${deployment}/chat/completions?api-version=2023-05-15`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'api-key': apiKey
                  },
                  body: JSON.stringify({
                    messages: [
                      { role: 'system', content: 'You are a documentation assistant.' },
                      { role: 'user', content: prompt }
                    ],
                    max_tokens: 800,
                    temperature: 0.0
                  })
                });
                if (!response.ok) {
                  throw new Error(`OpenAI error: ${response.status}`);
                }
                const respJson = await response.json();
                return respJson.choices[0].message.content;

          - name: Apply and commit doc patch
            run: |
              echo "${{ steps.gen_docs.outputs.result }}" > docs_patch.diff
              if [ -s docs_patch.diff ]; then
                git apply docs_patch.diff
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git commit -am "docs: update based on PR changes"
                git push origin HEAD:${{ github.head_ref }}
              else
                echo "No doc changes proposed."
              fi

