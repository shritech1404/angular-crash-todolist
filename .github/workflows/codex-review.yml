name: Codex PR Review (Optimized)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write          # needed to push README updates on same-repo PRs
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Prime caches (noop installs so caches warm)
        run: |
          echo '{}' > package.json
          npm ci || true
          python -m pip install --upgrade pip || true

      - name: Install Codex CLI & tools
        run: |
          npm i -g @openai/codex
          python -m pip install pipreqs

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
          model_reasoning_summary = "detailed"
          model_reasoning_effort = "high"
          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      - name: Analyze repo & generate all reports
        id: analyze
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          # -------- Inventory / filters ----------
          git ls-files > all_files.txt

          CODE_EXT='(c|cc|cpp|cxx|h|hpp|hh|m|mm|cs|go|java|kt|kts|ts|tsx|js|jsx|py|rb|rs|php|swift|scala|lua|pl|erl|ex|exs|r|sql|sh|bash|ps1|dart|vue|svelte|cmake|mk|Makefile|gradle|groovy|zig)'
          CODE=$(cat all_files.txt | grep -E "\\.${CODE_EXT}$" || true)
          CODE=$(echo "$CODE" | \
            grep -Ev '(^|/)\.github/|(^|/)node_modules/|(^|/)(dist|build|out|coverage|vendor)($|/)' | \
            grep -Ev '\.(ya?ml|toml|ini|conf|json|lock|md|rst|txt|png|jpe?g|gif|svg|pdf|map|min\.js)$' || true)

          printf "%s\n" $CODE > repo_code_files.txt || true

          git diff --name-status "$BASE...$HEAD" | awk '$1=="D"{print $2}' > deleted_files.txt || true

          CHANGED=$(git diff --name-only "$BASE...$HEAD" || true)
          CHANGED_CODE=$(echo "$CHANGED" | grep -F -f repo_code_files.txt || true)
          if [ -n "$CHANGED_CODE" ]; then
            git --no-pager diff --unified=0 "$BASE...$HEAD" -- $CHANGED_CODE > changed_code.diff || true
          else
            : > changed_code.diff
          fi

          HAS_CODE=false; [ -s repo_code_files.txt ] && HAS_CODE=true
          echo "has_code=$HAS_CODE" >> "$GITHUB_OUTPUT"

          # -------- Codex main review ----------
          if $HAS_CODE; then
            cat > review_task.txt << 'PROMPT'
            You are Codex running in CI on a GitHub Pull Request.
            GOAL: Review the ENTIRE repository (not just the diff) and produce a single Markdown report.

            MUST INCLUDE (in order):
            1) Summary
            2) Deleted Files & Potential Breakages (use deleted_files.txt; cite dependents, propose fixes)
            3) Vulnerabilities (file + line(s), severity, evidence, concrete fix)
            4) Performance (file + line(s), before/after snippet)
            5) Hardcoded Secrets (file + line(s), obfuscate values, mgmt guidance)
            6) Code Duplication (high-level, we’ll add detailed tool results)
            7) Changed Code (context only; use changed_code.diff)

            INPUTS: repo_code_files.txt, deleted_files.txt, changed_code.diff; you may read repo files.

            CONSTRAINTS: Be specific/actionable, include file paths & lines, prefer small patches, say “Likely” if unsure.
            OUTPUT: Markdown only.
            PROMPT
            REVIEW="$(codex exec "Read repo_code_files.txt, deleted_files.txt, and changed_code.diff, then follow review_task.txt. $(cat review_task.txt)")" || true
          else
            REVIEW=":white_check_mark: No code files found (non-code repo or everything excluded)."
          fi
          echo "${REVIEW:-':warning: Codex produced no review output.'}" > _codex_review.md

          # -------- Duplication (jscpd via npx) ----------
          if $HAS_CODE; then
            npx --yes jscpd@3 --silent --reporters json --output jscpd-report \
              --pattern "**/*.{js,jsx,ts,tsx,py,rb,java,go,php,cs,cpp,c,h,swift,kt,scala,rs,sh,sql,vue,svelte}" || true
            if [ -f jscpd-report/jscpd-report.json ]; then
              node - <<'JS' > _dup.md
              const fs = require('fs');
              const r = JSON.parse(fs.readFileSync('jscpd-report/jscpd-report.json','utf8'));
              if (!r.duplicates || !r.duplicates.length) { console.log("### Code Duplication\n\nNo significant duplications found."); process.exit(0); }
              let out = `### Code Duplication (jscpd)\n\nFound ${r.duplicates.length} duplication groups. Top items:\n\n`;
              for (const d of r.duplicates.slice(0, 50)) {
                const a = d.firstFile, b = d.secondFile;
                out += `- **${a.name}:${a.start.line}-${a.end.line}** ↔ **${b.name}:${b.start.line}-${b.end.line}** — **${d.lines} lines**\n`;
              }
              out += `\n> Consider extracting shared utilities or templates.`;
              console.log(out);
              JS
            else
              echo "### Code Duplication\n\nNo report generated." > _dup.md
            fi
          else
            echo "### Code Duplication\n\nSkipped (no code files)." > _dup.md
          fi

          # -------- Debug / print sweep (ripgrep) ----------
          if $HAS_CODE; then
            rg -n --no-heading --color never \
              -e '\bconsole\.log\(' \
              -e '\bprint\(' \
              -e '\bpdb\.set_trace\(' \
              -e '\blogger\.debug\(' \
              -e '\bSystem\.out\.println\(' \
              -e '\bfmt\.Print(f|ln)?\(' \
              -g '!**/node_modules/**' -g '!**/dist/**' -g '!**/build/**' \
              || true > debug_hits.txt
            if [ -s debug_hits.txt ]; then
              {
                echo "### Potential stray debug/log statements"
                echo
                echo "The following lines look like debug prints or verbose logs. Confirm they are intentional or guard with proper log levels/env checks."
                echo
                echo '```'
                sed -n '1,400p' debug_hits.txt
                [ $(wc -l < debug_hits.txt) -gt 400 ] && echo "... (truncated)"
                echo '```'
              } > _debug.md
            else
              echo "### Potential stray debug/log statements\n\nNo obvious stray print/log statements found." > _debug.md
            fi
          else
            echo "### Potential stray debug/log statements\n\nSkipped (no code files)." > _debug.md
          fi

          # -------- requirements.txt vs imports (Python) ----------
          if [ -f requirements.txt ] && $HAS_CODE; then
            pipreqs . --force --savepath generated_requirements.txt || true
            if ! diff -u requirements.txt generated_requirements.txt > reqs.diff 2>/dev/null; then
              {
                echo "### requirements.txt consistency"
                echo
                echo "Differences detected between **requirements.txt** and inferred imports:"
                echo
                echo '```diff'
                sed -n '1,400p' reqs.diff
                [ $(wc -l < reqs.diff) -gt 400 ] && echo "... (truncated)"
                echo '```'
                echo
                echo "- If new libraries are imported, add them to requirements."
                echo "- If unused entries exist, consider pruning to reduce install time and attack surface."
              } > _reqs.md
            else
              echo "### requirements.txt consistency\n\nNo differences found; requirements look in sync with imports." > _reqs.md
            fi
          else
            echo "### requirements.txt consistency\n\nNo requirements.txt found or skipped." > _reqs.md
          fi

          # -------- Config / ENV handling review (Codex) ----------
          if $HAS_CODE; then
            cat > env_review_prompt.txt << 'P'
            Scan the repository for configuration and environment variable usage:
            - Identify places reading env/config (os.environ, dotenv, process.env, argparse/flags, YAML/TOML/JSON configs).
            - For each, assess: defaulting, validation, secrets exposure, type coercion, and failure modes.
            - Call out missing defaults, unsafe fallbacks, or secrets printed to logs.
            - Suggest concrete fixes with small patches (add schema/validators, centralize config loader, redact logs).
            Output a concise Markdown report with file paths + line ranges.
            P
            OUT="$(codex exec "Read env_review_prompt.txt then read the repo and produce the requested report.")" || true
            echo "${OUT:-':warning: No output from env handling review.'}" > _env.md
          else
            echo "### Config & environment variable handling\n\nSkipped (no code files)." > _env.md
          fi

          # -------- README generation (Codex) ----------
          if $HAS_CODE; then
            cat > readme_prompt.txt << 'PROMPT'
            Generate a high-quality README.md from the current codebase:
            - Include: overview, features, quickstart, prerequisites, install, configuration (env vars), run locally, testing, linting, build/deploy, troubleshooting, security (secrets), contribution.
            - Auto-detect primary language, entry points, and services/CLIs.
            - Keep concise and actionable; use code blocks where needed. Output raw Markdown only.
            PROMPT
            README_NEW="$(codex exec "Read readme_prompt.txt, scan the repo, and output README.md.")" || true
            echo "${README_NEW:-''}" > README.generated.md

            # Decide: push vs suggest
            if [ -s README.generated.md ]; then
              [ -f README.md ] || touch README.md
              if diff -u README.md README.generated.md > README.patch; then
                echo "README is current." > _readme.md
              else
                if [ "${IS_SAME_REPO}" = "true" ]; then
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  mv README.generated.md README.md
                  git add README.md
                  git commit -m "docs: auto-update README.md via CI"
                  git push
                  echo "README auto-updated and pushed to PR branch." > _readme.md
                else
                  {
                    echo "README update suggested (cannot push to fork). Apply this patch if desired:"
                    echo
                    echo '```diff'
                    sed -n '1,400p' README.patch
                    [ $(wc -l < README.patch) -gt 400 ] && echo "... (truncated)"
                    echo '```'
                  } > _readme.md
                fi
              fi
            else
              echo "README generation produced no content; skipped." > _readme.md
            fi
          else
            echo "README step skipped (no code files)." > _readme.md
          fi

          # -------- Assemble single PR comment ----------
          {
            echo "## 🤖 Codex PR Review (Optimized)"
            echo
            echo "### Repository-wide Analysis"
            echo
            sed -n '1,200000p' _codex_review.md
            echo
            sed -n '1,200000p' _dup.md
            echo
            sed -n '1,200000p' _debug.md
            echo
            sed -n '1,200000p' _reqs.md
            echo
            echo "### Config & Environment"
            echo
            sed -n '1,200000p' _env.md
            echo
            echo "### README"
            echo
            sed -n '1,200000p' _readme.md
          } > _final_comment.md

          # Pass body to next step as output (handle huge strings safely)
          BODY_B64=$(base64 -w0 _final_comment.md)
          echo "body_b64=$BODY_B64" >> "$GITHUB_OUTPUT"

      - name: Post single PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const b64 = core.getInput('body_b64', { required: true });
            const body = Buffer.from(b64, 'base64').toString('utf8').trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
        with:
          body_b64: ${{ steps.analyze.outputs.body_b64 }}
