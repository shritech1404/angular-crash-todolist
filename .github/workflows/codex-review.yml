name: Codex PR Review (Full Repo + Deletion Impact)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      CODEX_MODEL: gpt-4o-mini
      AZURE_OPENAI_API_VERSION: preview

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Codex CLI
        run: npm i -g @openai/codex

      - name: Configure Codex (Azure OpenAI)
        run: |
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<'EOF'
          model = "${{ env.CODEX_MODEL }}"
          model_provider = "azure"
          approval_policy = "on-request"
          model_reasoning_summary = "detailed"
          model_reasoning_effort = "high"

          [model_providers.azure]
          name = "Azure"
          base_url = "${{ secrets.AZURE_OPENAI_ENDPOINT }}/openai/v1"
          http_headers = { "api-key" = "${{ secrets.AZURE_OPENAI_API_KEY }}" }
          wire_api = "responses"
          query_params = { api-version = "${{ env.AZURE_OPENAI_API_VERSION }}" }
          EOF

      # Build context for Codex: list deleted files (D), changed files, and language mix.
      - name: Build PR context (deleted files, changed files, languages)
        id: ctx
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Diff summary (names & statuses)
          git --no-pager diff --name-status "$BASE...$HEAD" > pr_name_status.txt || true
          git --no-pager diff --name-only  "$BASE...$HEAD" > pr_changed_files.txt || true
          awk '$1=="D"{print $2}' pr_name_status.txt > pr_deleted_files.txt || true

          # Language mix (rough)
          git ls-files | awk -F. 'NF>1{print $NF}' | tr '[:upper:]' '[:lower:]' | sort | uniq -c | sort -nr > repo_lang_mix.txt || true

          # Tight diff for ALL changes for impact reasoning (includes deletions metadata)
          git --no-pager diff --unified=0 "$BASE...$HEAD" > pr_unified0.diff || true

          # Expose counts as outputs
          echo "deleted_count=$(wc -l < pr_deleted_files.txt | tr -d ' ')" >> $GITHUB_OUTPUT
          echo "changed_count=$(wc -l < pr_changed_files.txt | tr -d ' ')" >> $GITHUB_OUTPUT

      # Prepare a comprehensive review prompt to scan the *whole repo* and also reason about the *diff*
      - name: Prepare full-repo review prompt
        run: |
          cat > review_task.txt << 'PROMPT'
          You are Codex running in CI on a GitHub Pull Request.

          GOAL
          - Perform a FULL-REPOSITORY code review (not just the diff).
          - ALSO analyze the PR diff to identify *deleted files* and explain likely runtime/build errors caused by those deletions (e.g., broken imports, missing exports, removed assets).
          - Produce a single, concise Markdown review formatted for a PR comment.

          INPUT ARTIFACTS YOU CAN READ
          - pr_unified0.diff          : tight diff (unified=0) between base and head
          - pr_name_status.txt        : lines like "D\tpath/file", "M\tpath/file", etc.
          - pr_deleted_files.txt      : just the paths that were deleted in this PR
          - pr_changed_files.txt      : all changed file paths
          - repo_lang_mix.txt         : language/extension distribution
          - The full repository workspace is available read-only (git ls-files, cat files, etc).

          REQUIRED CHECKS (cover the entire repo; mention high-priority issues first)
          1) DELETION IMPACT
             - If files were deleted: locate any references/usages (imports/require/includes/routes/assets) that will break.
             - Explain exact failure modes (e.g., TS compile error, runtime module-not-found, 404 asset) and in which files/lines they are likely to occur.
             - Provide concrete fixes or alternatives (restore, update imports, adjust DI/registrations, route changes, etc.) with small code blocks.

          2) VULNERABILITIES
             - Look for insecure patterns & libraries (dangerous eval, unsanitized input, SQL/NoSQL injection, XSS, CSRF, insecure crypto, weak hashing, insecure HTTP).
             - Point to files/lines where they appear and give minimal secure fixes.
             - If package manifests exist (package.json, requirements.txt, etc.), review for risky deps by name or known insecure patterns (no internet lookups).

          3) PERFORMANCE
             - Flag N+1 queries, heavy loops, unnecessary re-renders, large bundle patterns, blocking I/O, synchronous waits, unbounded retries, memory leaks.
             - Provide small optimized snippets or actionable suggestions.

          4) SECRETS / SENSITIVE DATA
             - Detect potential hardcoded secrets/tokens/keys/credentials and accidental logging of secrets/PII.
             - For any suspect string, show a short safe excerpt (mask most of the value) and file/line.

          5) CODE DUPLICATION / STRUCTURE
             - Identify obvious duplicate functions/logic across files (heuristic scan).
             - Suggest DRY refactors (shared utils/hooks/services), with brief example.

          6) STYLE / CONSISTENCY
             - Note key style inconsistencies that harm readability/maintainability (naming, null handling, error handling).
          
          OUTPUT FORMAT
          - Title, then sections:
            - Summary
            - Deletion Impact (with file paths and probable errors)
            - Vulnerabilities (with file/line & quick fixes)
            - Performance
            - Hardcoded Secrets
            - Code Duplication
            - Style & Consistency
            - Must-Fix Checklist
          - Keep it focused. Include small code blocks for fixes where helpful.
          PROMPT

      # Run Codex across the full repo; no file artifacts are created—capture STDOUT and post.
      - name: Run Codex full-repo review (no files)
        id: codex_review
        shell: bash
        run: |
          set -euo pipefail
          REVIEW="$(
            codex exec "Read pr_unified0.diff, pr_name_status.txt, pr_deleted_files.txt, pr_changed_files.txt, repo_lang_mix.txt, then follow review_task.txt. $(cat review_task.txt)"
          )" || true
          if [ -z "$REVIEW" ]; then
            REVIEW=":warning: Codex ran but produced no review output. Check CI logs."
          fi
          # Truncate if extremely long
          MAX=120000
          if [ ${#REVIEW} -gt $MAX ]; then
            REVIEW="${REVIEW:0:$MAX}\n\n… _(truncated)_"
          fi
          {
            echo 'body<<EOF'
            echo "$REVIEW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment to PR
        uses: actions/github-script@v7
        env:
          REVIEW_BODY_JSON: ${{ toJson(steps.codex_review.outputs.body) }}
        with:
          script: |
            const body = JSON.parse(process.env.REVIEW_BODY_JSON || '""').trim() || ":warning: Codex output was empty.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
